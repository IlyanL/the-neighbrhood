<!-- Fixture: the messages screen.

     Plain markup, no template tags. The bundle's own screens/messages.html
     cannot be used directly — its chips/convos/messages come from <sc-for>
     and <sc-if>, so it renders an empty page.

     This screen mixes real DS classes (nb-chips/nb-chip, nb-tag, nb-pill,
     nb-avatar, nb-field, nb-btn) with app-only layout classes the bundle
     draws inline (nb-inbox*, nb-convo*, nb-msg*) — see messages.xlate.html
     for the half this probe cannot see. Exercise one selected + one
     unselected conversation, one unread pill, and one "mine" + one "theirs"
     message bubble. -->
<div class="nb-pad">
  <div class="nb-inbox__filters">
    <div class="nb-chips">
      <button type="button" class="nb-chip nb-chip--current">All</button>
      <button type="button" class="nb-chip">Tutoring</button>
      <button type="button" class="nb-chip">Housing</button>
      <button type="button" class="nb-chip">Event</button>
      <button type="button" class="nb-chip">Unread</button>
    </div>
    <span class="nb-sec__count" style="margin-left:auto">6 of 6 conversations &middot; two waiting on you</span>
  </div>

  <div class="nb-inbox">
    <aside class="nb-inbox__list">
      <button type="button" class="nb-convo" data-active="true">
        <span class="nb-convo__top">
          <span class="nb-avatar nb-avatar--sm" style="background:var(--category-tutor);color:#fff">PR</span>
          <span class="nb-convo__body">
            <span class="nb-convo__nameRow">
              <b class="nb-convo__name">Priya Raman</b>
              <span class="nb-convo__when">9:41 a.m.</span>
            </span>
          </span>
        </span>
        <span class="nb-convo__foot">
          <span class="nb-tag">CALC 1000 &middot; Tutoring</span>
          <span class="nb-pill nb-pill--gold">New</span>
        </span>
      </button>
      <button type="button" class="nb-convo">
        <span class="nb-convo__top">
          <span class="nb-avatar nb-avatar--sm" style="background:var(--door-house);color:#fff">OL</span>
          <span class="nb-convo__body">
            <span class="nb-convo__nameRow">
              <b class="nb-convo__name">Old North landlord</b>
              <span class="nb-convo__when">Yesterday</span>
            </span>
          </span>
        </span>
        <span class="nb-convo__foot">
          <span class="nb-tag">Housing &middot; Room for rent</span>
        </span>
      </button>
    </aside>

    <main class="nb-inbox__main">
      <header class="nb-inbox__head">
        <span class="nb-avatar nb-avatar--sm" style="background:var(--category-tutor);color:#fff">PR</span>
        <div class="nb-inbox__who">
          <h2>Priya Raman</h2>
          <p class="nb-inbox__meta">CALC 1000 &middot; Tutoring</p>
        </div>
        <div class="nb-inbox__actions">
          <button type="button" class="nb-btn nb-btn--sm">Session</button>
        </div>
      </header>

      <div class="nb-inbox__stream">
        <div class="nb-msg">
          <div class="nb-msg__bubble">Bring the tutorial package and the two questions you flagged.</div>
          <span class="nb-msg__stamp">9:38 a.m.</span>
        </div>
        <div class="nb-msg nb-msg--mine">
          <div class="nb-msg__bubble">Will do — see you at 4:30.</div>
          <span class="nb-msg__stamp">9:41 a.m.</span>
        </div>
      </div>

      <form class="nb-inbox__composer">
        <label class="nb-field">
          <input placeholder="Write to Priya Raman&hellip;" aria-label="Message">
        </label>
        <button type="submit" class="nb-btn nb-btn--solid">Send</button>
      </form>
    </main>
  </div>
</div>
